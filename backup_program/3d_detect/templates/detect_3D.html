<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D検知設定</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

  <div class="top-menu">
  <button>設定</button>
  <button>3D画像</button>
  <div class="dropdown">
    <button class="dropdown-btn">機能選択 ▼</button>
    <div class="dropdown-content">
      <a href="/">原点設定</a>
      <a href="/3d_detect">3D検知</a>
    </div>
  </div>
  </div>

  <div class="upper-pane">
    <div class="top-left-pane">
      <div class="table-container">
        <table class="styled-table">
          <thead>
            <tr>
              <th>No.</th>
              <th>使用数</th>
              <th>コメント</th>
            </tr>
          </thead>
          <tbody>
            <!-- JavaScriptで動的に追加されます -->
          </tbody>
        </table>
      </div>
    </div>
    <div class="top-right-pane">
      <div class="camera-area">
        <img id="cameraStream" src="/stream/rgb" style="width:100%; height:auto;">
      </div>  
      <div class="image-buttons">
        <button id="colorBtn">カラー画像</button>
        <button id="depthBtn">深度画像</button>
      </div>
      </div>
    </div>
  </div>

  <div class="buttom-pane">

    <table class="judge-table">
      <thead>
        <tr>
          <th rowspan="2">総合判定</th>
          <th rowspan="2">原点No</th>
          <th rowspan="2">判定No</th>
          <th colspan="2">高さ範囲</th>
          <th colspan="4">ピクセル判定</th>
          <th rowspan="2">検知時間</th>
          <th rowspan="2">コメント</th>
        </tr>
        <tr>
          <th>下限</th>
          <th>上限</th>
          <th>下限</th>
          <th>上限</th>
          <th>現在値</th>
          <th>判定</th>
        </tr>
      </thead>
      <tbody>
        <!-- JavaScriptで動的に生成されます -->
      </tbody>
    </table>

    <div class="selection-status-area">
      <span id="selectionStatus" class="selection-status">判定行を選択してください</span>
    </div>

    <div class="judge-btn-area">
      <button id="captureBtn">取得</button>
      <button id="saveBtn">登録</button>
      <button>閉じる</button>
    </div>

  </div>

<!-- カウントダウンポップアップ -->
<div id="countdownPopup" class="countdown-popup" style="display: none;">
    <div class="countdown-content">
        <div id="countdownNumber" class="countdown-number">3</div>
        <div class="countdown-text">計測開始まで</div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/detect_3D.js') }}"></script>

</body>
</html>
