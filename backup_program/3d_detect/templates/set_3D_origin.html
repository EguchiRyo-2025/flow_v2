<!-- templates/set_3D_origin.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D原点設定</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

<div class="top-menu">
  <button>設定</button>
  <button>3D画像</button>
  <div class="dropdown">
    <button class="dropdown-btn">機能選択 ▼</button>
    <div class="dropdown-content">
      <a href="/">原点設定</a>
      <a href="/3d_detect">3D検知</a>
    </div>
  </div>
</div>

<div class="main-content">
  <div class="left-pane">
    <div class="table-container">
      <table class="styled-table">
        <thead>
          <tr>
            <th>No.</th>
            <th>使用数</th>
            <th>コメント</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>0</td><td></td><td contenteditable="true"></td></tr>
        </tbody>
      </table>
    </div>
    <div class="table-buttons">
      <button id="addBtn">新規</button>
      <button id="editBtn">編集</button>
      <button>削除</button>
    </div>
  </div>

  <div class="right-pane">
    <div class="camera-area">
      <img id="cameraStream" src="/stream/rgb">
      <div id="resizableBox">
        <div class="comment-display" id="commentDisplay"></div>
        <div class="resize-handle"></div>
      </div>
    </div>

    <div class="image-buttons">
      <button id="colorBtn">カラー画像</button>
      <button id="depthBtn">深度画像</button>
    </div>

    <div class="origin-button">
      <button>原点登録</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/set_3D_origin.js') }}"></script>

</body>
</html>
