<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>図形マッピング</title>
    <link rel="stylesheet" href="{{ url_for('module_static', module_name='mapping', filename='css/styles.css') }}">
</head>
<body>
    
<div class="top-menu">
    <button>設定</button>
    <button>描画・音</button>
</div>

<div class="main-content">
    <div class="left-pane">
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>コメント</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>0</td>
                        <td></td>
                    </tr>
                </tbody>
            </table>
        <div class="table-action-buttons">
            <div class="table-edit-buttons">
                <button class="btn-table-action" id="new-row">新規</button>
                <button class="btn-table-action" id="add-row">登録</button>
                <button class="btn-table-action btn-danger" id="delete-row">削除</button>
            </div>
            <div class="bulk-move-section">
                <div class="bulk-move-controls">
                    <div class="bulk-move-row">
                        <span>X:</span>
                        <button class="btn-bulk-small" id="bulk-x-minus">−</button>
                        <input type="number" id="bulk-x-value" value="0" step="10">
                        <button class="btn-bulk-small" id="bulk-x-plus">＋</button>
                    </div>
                    <div class="bulk-move-row">
                        <span>Y:</span>
                        <button class="btn-bulk-small" id="bulk-y-minus">−</button>
                        <input type="number" id="bulk-y-value" value="0" step="10">
                        <button class="btn-bulk-small" id="bulk-y-plus">＋</button>
                    </div>
                    <button class="btn-bulk-apply" id="bulk-apply-move">一括移動適用</button>
                </div>
            </div>
        </div>
        </div>
    </div>
    <div class="right-pane">
        <div class="tabs">
            <button class="tab-button active" data-tab="visual">図形・画像</button>
            <button class="tab-button" data-tab="sound">音</button>
        </div>
        <div class="tab-content">
            <!-- コンポーネントがここに動的に読み込まれます -->
        </div>
    </div>
</div>

<script src="{{ url_for('module_static', module_name='mapping', filename='js/group_manager.js') }}"></script>
<script src="{{ url_for('module_static', module_name='mapping', filename='js/element_manager.js') }}"></script>
<script src="{{ url_for('module_static', module_name='mapping', filename='js/display_window_manager.js') }}"></script>
<script src="{{ url_for('module_static', module_name='mapping', filename='js/main.js') }}"></script>
<script src="{{ url_for('module_static', module_name='mapping', filename='js/window_manager.js') }}"></script>
<script>
// グループ管理とインスタンスを初期化
document.addEventListener('DOMContentLoaded', () => {
    window.groupManager = new GroupManager();
    window.elementManager = new ElementManager();
});
</script>
</body>
</html>
