<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ display_target }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            overflow: hidden;
            position: relative;
            width: 100vw;
            height: 100vh;
            user-select: none;
        }
        
        #display-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            user-select: none;
            -webkit-user-drag: none;
        }
        
        .display-image {
            position: absolute;
            transition: none;
            cursor: move;
            user-select: none;
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            pointer-events: auto;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        
        .display-image:hover {
            outline: 2px solid #00FF00;
            z-index: 1000;
        }
        
        .display-image.dragging {
            opacity: 0.8;
            z-index: 9999;
        }
        
        .display-image.selected {
            outline: 3px solid #FFD700;
            z-index: 999;
        }
        
        /* リサイズハンドル（四隅+四辺中央の8つ） */
        .resize-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #FFD700;
            border: 2px solid #000;
            border-radius: 2px;
            display: none;
            z-index: 10001;
            pointer-events: auto;
        }
        
        .resize-handle.nw { cursor: nw-resize; }
        .resize-handle.n { cursor: n-resize; }
        .resize-handle.ne { cursor: ne-resize; }
        .resize-handle.e { cursor: e-resize; }
        .resize-handle.se { cursor: se-resize; }
        .resize-handle.s { cursor: s-resize; }
        .resize-handle.sw { cursor: sw-resize; }
        .resize-handle.w { cursor: w-resize; }
        
        .display-image.selected ~ .resize-handle {
            display: block;
        }
        
        /* 情報パネル（デバッグ用） */
        .info-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #00FF00;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            z-index: 100000;
            min-width: 250px;
        }
        
        .info-panel h3 {
            margin-bottom: 10px;
            color: #FFD700;
            font-size: 16px;
        }
        
        .info-panel .info-item {
            margin: 5px 0;
        }
        
        .info-panel .info-label {
            color: #888;
            display: inline-block;
            width: 100px;
        }
        
        .info-panel button {
            margin-top: 10px;
            padding: 8px 15px;
            cursor: pointer;
            width: 100%;
            background: #333;
            color: #0F0;
            border: 1px solid #0F0;
            border-radius: 3px;
            font-family: inherit;
        }
        
        .info-panel button:hover {
            background: #0F0;
            color: #000;
        }
    </style>
</head>
<body>
    <div id="display-canvas"></div>
    
    <div class="info-panel" id="info-panel">
        <h3>{{ display_target }}</h3>
        <div class="info-item">
            <span class="info-label">要素数:</span>
            <span id="element-count">0</span>
        </div>
        <div class="info-item">
            <span class="info-label">グループID:</span>
            <span id="current-group">未選択</span>
        </div>
        <div class="info-item">
            <span class="info-label">選択中:</span>
            <span id="selected-element">なし</span>
        </div>
        <button id="toggle-info-btn">情報パネルを隠す</button>
    </div>

    <script>
        window.DISPLAY_TARGET = "{{ display_target }}";
    </script>
    <script src="{{ url_for('module_static', module_name='mapping', filename='js/display_window.js') }}"></script>
</body>
</html>
