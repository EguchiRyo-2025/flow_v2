[project]
name = "flow-designer"
version = "0.1.0"
description = "デジタル作業台のフロー設計・実行システム"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary" }
authors = [
    { name = "Digital Workbench Team" }
]

dependencies = [
    "blinker==1.6.2",
    "bottle==0.13.4",
    "cffi==1.17.1",
    "click==8.1.7",
    "clr-loader==0.2.8",
    "colorama==0.4.6",
    "flask==2.2.5",
    "flask-cors==5.0.0",
    "sqlalchemy==2.0.0",
    "importlib-metadata==8.5.0",
    "itsdangerous==2.1.2",
    "jinja2==3.1.2",
    "markupsafe==2.1.3",
    "mouseinfo==0.1.3",
    "numpy==1.24.4",
    "opencv-python==4.7.0.72",
    "pillow==10.4.0",
    "primesense==2.2.0.30.post5",
    "proxy-tools==0.1.0",
    "pyautogui==0.9.54",
    "pycparser==2.23",
    "pygetwindow==0.0.9",
    "pymsgbox==2.0.1",
    "pyperclip==1.11.0",
    "pyrect==0.2.0",
    "pyscreeze==1.0.1",
    "python-dotenv==1.0.1",
    "pythonnet==3.0.5",
    "pytweening==1.2.0",
    "pywebview==4.4.1",
    "screeninfo==0.8.1",
    "typing-extensions==4.13.2",
    "werkzeug==2.2.3",
    "zipp==3.20.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=1.0.0",
]

postgresql = [
    "psycopg2-binary>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "modules", "frontend"]

[tool.uv]
dev-dependencies = []

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=core",
    "--cov=modules",
    "--cov-report=html",
    "--cov-report=term-missing",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
