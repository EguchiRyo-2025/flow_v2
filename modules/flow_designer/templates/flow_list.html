{% extends "base.html" %}

{% block title %}フロー一覧 - Digital Workbench{% endblock %}

{% block head %}
<link rel="stylesheet" href="/modules/flow_designer/static/css/flow_list.css">
{% endblock %}

{% block content %}
<div class="main-content">
    <div class="left-pane">
        <div class="table-container">
            <h2>保存済みフロー</h2>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>フロー名</th>
                        <th>ステップ数</th>
                        <th>最終更新</th>
                    </tr>
                </thead>
                <tbody id="flow-list">
                    <tr>
                        <td colspan="4" style="text-align: center;">読込中...</td>
                    </tr>
                </tbody>
            </table>
            <div class="table-action-buttons">
                <div class="table-edit-buttons">
                    <button class="btn-table-action" onclick="window.location.href='/flow/designer'">新規作成</button>
                    <button class="btn-table-action" id="load-flow">読込</button>
                    <button class="btn-table-action btn-danger" id="delete-flow">削除</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="right-pane">
        <div>
            <h2>フロー詳細</h2>
            <div id="flow-detail">
                <p class="no-selection">左側のリストからフローを選択してください</p>
            </div>
            
            <div class="flow-execution-section">
                <h3>フロー実行</h3>
                <button id="execute-flow" class="btn-table-action" disabled>
                    フローを実行
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/modules/flow_designer/static/js/flow_list.js"></script>
{% endblock %}
