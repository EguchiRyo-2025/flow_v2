<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プレビュー - {{ display_target }}</title>
    <link rel="stylesheet" href="/modules/mapping/static/css/preview_window.css">
</head>
<body>
    <div id="preview-canvas"></div>
    <div class="preview-cursor" id="preview-cursor"></div>
    
    <div class="info-panel">
        <div>表示先: <span id="display-name">{{ display_target }}</span></div>
        <div>解像度: <span id="resolution"></span></div>
        <div>要素数: <span id="element-count">0</span></div>
        <button id="fullscreen-toggle-btn">全画面表示</button>
        <button id="hide-info-btn">情報を非表示</button>
    </div>

    <script>
        window.DISPLAY_TARGET = "{{ display_target }}";
    </script>
    <script src="/modules/mapping/static/js/polygon_interactive_editor.js"></script>
    <script src="/modules/mapping/static/js/preview_window.js"></script>
</body>
</html>
