<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プレビュー - {{ display_target }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            overflow: hidden;
            position: relative;
        }
        
        #preview-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .preview-image {
            position: absolute;
            transition: none;
            cursor: move;
            user-select: none;
        }
        
        .preview-image:hover {
            outline: 2px solid #007BFF;
        }
        
        .preview-image.dragging {
            opacity: 0.7;
        }
        
        .preview-cursor {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid red;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            display: none;
        }
        
        .info-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 10000;
        }
    </style>
</head>
<body>
    <div id="preview-canvas"></div>
    <div class="preview-cursor" id="preview-cursor"></div>
    
    <div class="info-panel">
        <div>表示先: <span id="display-name">{{ display_target }}</span></div>
        <div>解像度: <span id="resolution"></span></div>
        <div>要素数: <span id="element-count">0</span></div>
        <button id="fullscreen-toggle-btn" style="margin-top: 10px; padding: 5px 10px; cursor: pointer; width: 100%;">全画面表示</button>
        <button id="hide-info-btn" style="margin-top: 5px; padding: 5px 10px; cursor: pointer; width: 100%;">情報を非表示</button>
    </div>

    <script>
        window.DISPLAY_TARGET = "{{ display_target }}";
    </script>
    <script src="/modules/mapping/static/js/polygon_interactive_editor.js"></script>
    <script src="/modules/mapping/static/js/preview_window.js"></script>
</body>
</html>
