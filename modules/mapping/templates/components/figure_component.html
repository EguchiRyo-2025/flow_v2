<div class="figure-component">
    <h3>図形設定</h3>
    <div class="component-layout">
        <!-- 左側：図形一覧テーブル -->
        <div class="figure-list-section">
            <h4>図形一覧</h4>
            
            <!-- ON/OFFタブ -->
            <div class="figure-state-tabs">
                <button class="figure-tab active" data-state="on">ON時の図形</button>
                <button class="figure-tab" data-state="off">OFF時の図形</button>
            </div>
            
            <!-- ON時の図形テーブル -->
            <div class="figure-table-container" id="on-figure-container">
                <table class="figure-table">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>内容</th>
                            <th>コメント</th>
                        </tr>
                    </thead>
                    <tbody id="figure-list-on">
                        <!-- ON時の図形が追加されます -->
                    </tbody>
                </table>
            </div>
            
            <!-- OFF時の図形テーブル -->
            <div class="figure-table-container hidden" id="off-figure-container">
                <table class="figure-table">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>内容</th>
                            <th>コメント</th>
                        </tr>
                    </thead>
                    <tbody id="figure-list-off">
                        <!-- OFF時の図形が追加されます -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- 右側：設定パネル -->
        <div class="figure-settings-section">
            <div class="component-content">
                <div class="form-group">
                    <label for="dest">表示先:</label>
                    <select id="dest" class="form-control">
                        <option value="monitor">モニター</option>
                        <option value="parts_shelf">部品棚</option>
                        <option value="worktable">作業台</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="comment">コメント:</label>
                    <input type="text" id="comment" class="form-control">
                </div>

                <!-- 点滅制御 -->
                <div class="blink-control">
                    <h4>点滅制御</h4>
                    <div class="blink-toggle">
                        <label class="switch">
                            <input type="checkbox" id="blink-enabled">
                            <span class="slider"></span>
                        </label>
                        <span class="toggle-label">ON/OFF</span>
                    </div>
                    <div class="blink-timing">
                        <div class="timing-group">
                            <label for="blink-on-time">ON時間:</label>
                            <input type="number" id="blink-on-time" class="timing-input" value="0.5" step="0.1" min="0.1">s
                        </div>
                        <div class="timing-group">
                            <label for="blink-off-time">OFF時間:</label>
                            <input type="number" id="blink-off-time" class="timing-input" value="0.5" step="0.1" min="0.1">s
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="figure-type">図形タイプ:</label>
                    <select id="figure-type" class="form-control">
                        <option value="polygon">多角形</option>
                        <option value="rectangle">矩形</option>
                        <option value="circle">円</option>
                        <option value="triangle">三角形</option>
                    </select>
                </div>
                
                <div class="form-row">
                    <div class="form-group flex-grow">
                        <label for="figure-color">色:</label>
                        <input type="color" id="figure-color" class="form-control" value="#007BFF">
                    </div>
                    <button class="btn btn-cursor-apply" id="cursor-move">カーソル移動</button>
                </div>

                
                <div class="button-group">
                    <button class="btn btn-primary" id="add-figure">追加</button>
                    <button class="btn btn-secondary" id="delete-figures">削除</button>
                </div>
            </div>
        </div>
    </div>
</div>
